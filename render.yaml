services:
  - type: web
    name: secscan-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: REFERENCE_DIR
        value: /etc/secrets
      - key: GLOBAL_REVIEWS_PER_DAY
        value: "50"
      - key: INSTALLATION_REVIEWS_PER_DAY
        value: "5"
      - key: REVIEWS_PER_HOUR
        value: "3"
      - key: REGISTRATIONS_PER_DAY
        value: "100"
